[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production context settings
[context.production]
  # We leave NODE_ENV out here because it can prevent devDependencies (like tsc) from installing.
  # Netlify/Vite will handle production modes automatically.

