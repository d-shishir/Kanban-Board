name: Netlify Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint || echo "Linting failed, proceeding with build..."

      - name: Build Project
        run: npm run build

      # Note: Netlify usually has its own GitHub App for deployments,
      # but this Action ensures the build passes before merging.
      - name: Build Success Check
        run: echo "Build was successful and is ready for Netlify deployment."
